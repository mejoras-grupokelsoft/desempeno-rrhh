# Configuración de despliegue de Netlify
[build]
  # Comando para construir el proyecto
  command = "npm run build"

  # Directorio donde está el build final
  publish = "dist"

  # Directorio de Netlify Functions (ej: envío de email por Gmail SMTP)
  functions = "netlify/functions"

  # Variables de entorno necesarias (configurar en Netlify UI)
  # VITE_GOOGLE_CLIENT_ID
  # VITE_APP_TITLE
  # VITE_APP_VERSION
  # VITE_ENABLE_DEBUG
  # VITE_API_TIMEOUT
  # GMAIL_USER            (server-side, sin prefijo VITE_ — no se expone al navegador)
  # GMAIL_APP_PASSWORD    (server-side, sin prefijo VITE_ — no se expone al navegador)

# Habilitar branch deploys para la rama QA
# Esto genera una URL tipo: qa--tu-sitio.netlify.app
[context.branch-deploy]
  command = "npm run build"

# Listar ramas que Netlify debe deployar además de main
[context.qa]
  command = "npm run build"

# Desactivar escaneo para variables VITE_ que son públicas del frontend
# Estas variables DEBEN estar en el bundle de JavaScript para que el frontend funcione
[build.environment]
  NODE_VERSION = "20"
  SECRETS_SCAN_OMIT_KEYS = "VITE_GOOGLE_CLIENT_ID,VITE_APP_VERSION,VITE_APP_TITLE,VITE_API_TIMEOUT,VITE_ENABLE_DEBUG"

# Redirecciones para React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers de seguridad
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
